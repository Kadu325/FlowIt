<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="clockGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="dialGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </radialGradient>
    <filter id="shadowClock" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#d97706" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Sombra Projetada Inferior -->
  <ellipse cx="60" cy="104" rx="36" ry="8" fill="#b45309" opacity="0.25" filter="blur(6px)"/>

  <!-- Campainhas do Despertador 3D -->
  <circle cx="34" cy="30" r="12" fill="#d97706"/>
  <circle cx="34" cy="30" r="9" fill="#f59e0b"/>
  <circle cx="86" cy="30" r="12" fill="#d97706"/>
  <circle cx="86" cy="30" r="9" fill="#f59e0b"/>
  <!-- Pés do Relógio -->
  <rect x="32" y="86" width="10" height="16" rx="5" transform="rotate(22 32 86)" fill="#d97706"/>
  <rect x="78" y="86" width="10" height="16" rx="5" transform="rotate(-22 78 86)" fill="#d97706"/>

  <!-- Corpo do Relógio -->
  <g filter="url(#shadowClock)">
    <circle cx="60" cy="62" r="38" fill="url(#clockGrad)"/>
    <!-- Aro Interno -->
    <circle cx="60" cy="62" r="30" fill="url(#dialGrad)"/>
    <!-- Marcadores de Hora -->
    <circle cx="60" cy="38" r="2.5" fill="#d97706"/>
    <circle cx="84" cy="62" r="2.5" fill="#d97706"/>
    <circle cx="60" cy="86" r="2.5" fill="#d97706"/>
    <circle cx="36" cy="62" r="2.5" fill="#d97706"/>
    <!-- Ponteiros 3D -->
    <line x1="60" y1="62" x2="60" y2="44" stroke="#d97706" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="60" y1="62" x2="74" y2="62" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Centro do Ponteiro -->
    <circle cx="60" cy="62" r="4.5" fill="#b45309"/>
    <!-- Brilho Vidro Curvo -->
    <path d="M 38 48 C 45 40, 60 38, 76 44 C 65 48, 48 56, 38 48 Z" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>
