<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="checkGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
    <filter id="shadowCheck" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#047857" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="checkShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <!-- Sombra Projetada Inferior -->
  <ellipse cx="60" cy="104" rx="36" ry="8" fill="#065f46" opacity="0.25" filter="blur(6px)"/>

  <!-- Esfera 3D Verde -->
  <g filter="url(#shadowCheck)">
    <circle cx="60" cy="60" r="38" fill="url(#checkGrad)"/>
    <!-- Reflexo Superior de Vidro -->
    <ellipse cx="60" cy="38" rx="22" ry="12" fill="url(#checkShine)"/>
    <!-- Checkmark Branco em Relevo -->
    <path d="M 44 60 L 55 71 L 78 47" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
