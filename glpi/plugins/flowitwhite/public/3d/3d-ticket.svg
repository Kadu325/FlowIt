<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="tktGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <radialGradient id="tktBack" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </radialGradient>
    <filter id="shadow3d" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <!-- Sombra Projetada Inferior -->
  <ellipse cx="60" cy="104" rx="38" ry="8" fill="#0369a1" opacity="0.25" filter="blur(6px)"/>
  
  <!-- Ticket Posterior Secundário (Perspectiva 3D) -->
  <g transform="rotate(-10 60 60)">
    <rect x="26" y="24" width="68" height="48" rx="12" fill="url(#tktBack)" opacity="0.65"/>
  </g>
  
  <!-- Ticket Principal Frontal -->
  <g filter="url(#shadow3d)">
    <rect x="22" y="32" width="76" height="56" rx="14" fill="url(#tktGrad)"/>
    <!-- Brilho Superior Curvo -->
    <path d="M 22 46 C 22 38, 30 32, 40 32 L 80 32 C 90 32, 98 38, 98 46 C 70 42, 45 44, 22 46 Z" fill="url(#shine)"/>
    <!-- Recortes Laterais do Ticket -->
    <circle cx="22" cy="60" r="7" fill="#f8fafc"/>
    <circle cx="98" cy="60" r="7" fill="#f8fafc"/>
    <!-- Linha Pontilhada Interna -->
    <line x1="33" y1="60" x2="87" y2="60" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 4" stroke-opacity="0.7"/>
    <!-- Estrela Central 3D -->
    <path d="M 60 42 L 63 49 L 70 50 L 65 55 L 66 62 L 60 58 L 54 62 L 55 55 L 50 50 L 57 49 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="60" cy="73" r="4" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
