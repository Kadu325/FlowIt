<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="shieldGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </radialGradient>
    <filter id="shadowShield" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#b91c1c" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="shieldShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <!-- Sombra Projetada Inferior -->
  <ellipse cx="60" cy="106" rx="36" ry="7" fill="#991b1b" opacity="0.25" filter="blur(6px)"/>

  <!-- Escudo Frontal 3D -->
  <g filter="url(#shadowShield)">
    <path d="M 60 20 C 78 20, 96 26, 96 44 C 96 74, 60 98, 60 98 C 60 98, 24 74, 24 44 C 24 26, 42 20, 60 20 Z" fill="url(#shieldGrad)"/>
    <!-- Brilho Lateral Superior -->
    <path d="M 60 24 C 74 24, 88 29, 88 44 C 88 56, 75 70, 60 80 C 60 24, 60 24, 60 24 Z" fill="url(#shieldShine)"/>
    <!-- Borda Interna Suave -->
    <path d="M 60 26 C 74 26, 88 31, 88 45 C 88 70, 60 90, 60 90 C 60 90, 32 70, 32 45 C 32 31, 46 26, 60 26 Z" fill="none" stroke="#fecaca" stroke-width="2.5" opacity="0.6"/>
    <!-- Ícone de Alerta / Raio no Centro -->
    <path d="M 62 38 L 48 58 L 58 58 L 56 76 L 72 54 L 62 54 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
